<div
  class="modal-overlay"
  (click)="closeModal()"
  (keydown.enter)="closeModal()"
  tabindex="1"
  *transloco="let t; read: 'admin.editFlagsComponent'">
  <div
    class="modal"
    (click)="$event.stopPropagation()"
    (keydown.enter)="$event.stopPropagation()"
    tabindex="2">
    <h2>{{ t('titleMainModalDeleteConfirm') }}</h2>

    <p>
      {{ t('textMainModalDeleteConfirm') }}
      <strong> {{ flag?.name || 'Error' }} </strong>?
    </p>

    <div class="buttons">
      <button mat-stroked-button class="cancel-btn" (click)="closeModal()">
        {{ t('cancel') }}
      </button>
      <button mat-flat-button class="delete-btn" (click)="confirmDelete()">
        {{ t('delete') }}
      </button>
    </div>
  </div>
</div>
