<div style="margin: 1em">
  <app-breadcrumb />
</div>
<ng-container *ngIf="dataSource; else loading">
  <app-basic-table
    [dataSource]="dataSource"
    [displayedColumns]="displayedColumns"
    [showDiagnosis]="showDiagnosis"
    [isPdfAttached]="false">
  </app-basic-table>
</ng-container>

<ng-template #loading>
  <app-spinner size="75"></app-spinner>
</ng-template>
