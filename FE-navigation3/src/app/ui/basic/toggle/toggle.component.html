<button
  type="button"
  class="toggle-button"
  [class.checked]="checked"
  [class.disabled]="disabled"
  [disabled]="disabled"
  (click)="onToggle()">
  <span class="toggle-switch">
    <span class="toggle-thumb"></span>
  </span>

  <span class="toggle-label">
    {{ label }}
  </span>
</button>
