name: Build and push Docker image

on:
  push:
    tags:
      - 'HIPA-FE_**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Run checks
        run: |
          branches=$(git branch -r --contains ${{ github.ref }})
          echo "Branches where tag exists: $branches"
          echo "Checking if any of them is a release branch..."

          if [[ -z "$branches" ]]; then
            echo "No branches contain this tag. Exiting."
            exit 1
          fi

          if echo "$branches" | grep -q "release/"; then
            echo "Release branch found, continuing."
          else
            echo "No release branch found, exiting."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.ANDREJ_GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6.9.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
